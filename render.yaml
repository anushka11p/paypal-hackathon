# One web service runs both processes (see backend/start.sh) and serves the built frontend.
# The hosted demo uses the built-in payment simulator. To use the real PayPal sandbox instead,
# remove LEASH_PAYMENTS and add PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET and
# PAYPAL_BASE_URL=https://api-m.sandbox.paypal.com in the Render dashboard.
services:
  - type: web
    name: leash
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.16.0
      - key: LEASH_PAYMENTS
        value: simulator
      - key: GROQ_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: MANDATE_SIGNING_SECRET
        generateValue: true
